# Codegen configuration for Soulcalibur V (Xbox 360, World), default.xex 0.0.0.2 with title update 1
# (default.xexp -> 0.0.1.2), title 4E4D083D, media 165FAD4F. Every address below is for that patched
# image only (docs/TARGET.md); tools/imagedump writes it, tools/py/disasm.py reads it.

# Leaf functions without .pdata entries that are only reached by tail branches (b), so the
# scanner does not find them on its own.
[functions]
# virtual-call forwarders: lwz r11,0x14(r3); lwz r10,0(r11); lwz r3,4(r11); lwz r11,N(r10); mtctr; bctr
0x8259D0D8 = { end = 0x8259D0F0 }   # slot 0x5C
0x8259D0F0 = { end = 0x8259D108 }   # slot 0x60
0x8259D108 = { end = 0x8259D120 }   # slot 0x64
0x8259D120 = { end = 0x8259D138 }   # slot 0x68
0x8259D138 = { end = 0x8259D150 }   # slot 0x6C
0x8254FE00 = { end = 0x8254FE08 }   # addi r3,r3,8; b 0x825521D8 (this-adjusting thunk)
0x8254D918 = { end = 0x8254D934 }   # argument shuffle, b 0x82555C70
0x82593B30 = { end = 0x82593B5C }   # list append, blr
# a small-block allocator's free and its two adapters (mr r3,r4; b ...), none with .pdata: the scanner merged them
# into sub_822DD840, leaving the free's own branches unresolved (REX_FATAL had any of them been taken)
0x822DD830 = { end = 0x822DD838 }   # mr r3,r4; b 0x822DD840
0x822DD838 = { end = 0x822DD840 }   # mr r3,r4; b 0x822DDA10
0x822DDA10 = { end = 0x822DDAE0 }   # free(r3): cmplwi r3,0; beqlr ...

# The game reads address 0 on purpose: sub_822B4510 (a parameter-table getter) loads its out-of-range default
# with "li r11,0; lhz r11,0(r11)" (0x822B45F8). The console reads that as 0; the runtime maps the zero page
# readable for it (sc5_app.cpp: protect_zero off).

# Checks inserted into the game's code (src/sc5/guards.cpp): where its own code reads through a pointer that can be
# empty and the console's memory map let that pass.
# sub_82480C08, a battle object's state save (vtable 0x820DA7A0 slot 4; run for each of the game's battle state
# snapshots, about every 80 frames of a fight, for the KO replay: docs/GAME.md), writes a field of its owner (+0x264,
# +0x5BE90 into it) without checking that there is one; the objects sub_82485B38 builds for a VS fight have none, and
# guest 0x0005BE90 is not mapped here. Its restore (slot 5, sub_82480C90) reads the 4 bytes and skips them when the
# owner is none: zeros do.
[[midasm_hook]]
name = "Sc5GuardOwnerField"
address = 0x82480C6C          # mtctr r6: r4 = [this+0x264] + 0x5BE90, what the 4-byte write reads
registers = ["r4"]

