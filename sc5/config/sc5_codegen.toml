# Codegen configuration for Soulcalibur V (Xbox 360, World), default.xex 0.0.0.2 with title update 1
# (default.xexp -> 0.0.1.2), title 4E4D083D, media 165FAD4F. Every address below is for that patched
# image only (docs/TARGET.md); tools/imagedump writes it, tools/py/disasm.py reads it.

# Leaf functions without .pdata entries that are only reached by tail branches (b), so the
# scanner does not find them on its own.
[functions]
# virtual-call forwarders: lwz r11,0x14(r3); lwz r10,0(r11); lwz r3,4(r11); lwz r11,N(r10); mtctr; bctr
0x8258D350 = { end = 0x8258D368 }   # slot 0x5C
0x8258D368 = { end = 0x8258D380 }   # slot 0x60
0x8258D380 = { end = 0x8258D398 }   # slot 0x64
0x8258D398 = { end = 0x8258D3B0 }   # slot 0x68
0x8258D3B0 = { end = 0x8258D3C8 }   # slot 0x6C
0x82540020 = { end = 0x82540028 }   # addi r3,r3,8; b 0x8254DF00 (this-adjusting thunk)
0x8253DB68 = { end = 0x8253DB84 }   # argument shuffle, b 0x82545FC0
0x82583DC0 = { end = 0x82583DEC }   # list append, blr
# a small-block allocator's free and its two adapters (mr r3,r4; b ...), none with .pdata: the scanner merged them
# into sub_822D0BA0, leaving the free's own branches unresolved (REX_FATAL had any of them been taken)
0x822D0B90 = { end = 0x822D0B98 }   # mr r3,r4; b 0x822D0BA0
0x822D0B98 = { end = 0x822D0BA0 }   # mr r3,r4; b 0x822D0D70
0x822D0D70 = { end = 0x822D0E40 }   # free(r3): cmplwi r3,0; beqlr ...

# The game reads address 0 on purpose: sub_822A7CF8 (a parameter-table getter) loads its out-of-range default
# with "li r11,0; lhz r11,0(r11)" (0x822A7DE0). The console reads that as 0; the runtime maps the zero page
# readable for it (sc5_app.cpp: protect_zero off).

# Checks inserted into the game's code (src/sc5/guards.cpp): where its own code reads through a pointer that can be
# empty and the console's memory map let that pass.
# sub_824717A8, a battle object's state save (vtable 0x820D9DB0 slot 4; run for each of the game's battle state
# snapshots, about every 80 frames of a fight, for the KO replay: docs/GAME.md), writes a field of its owner (+0x264,
# +0x5BE90 into it) without checking that there is one; the objects sub_82476720 builds for a VS fight have none, and
# guest 0x0005BE90 is not mapped here. Its restore (slot 5, sub_82471830) reads the 4 bytes and skips them when the
# owner is none: zeros do.
[[midasm_hook]]
name = "Sc5GuardOwnerField"
address = 0x8247180C          # mtctr r6: r4 = [this+0x264] + 0x5BE90, what the 4-byte write reads
registers = ["r4"]

