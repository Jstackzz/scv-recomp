# The battle state snapshot sub_8215A298 has just written (docs\GAME.md, "The battle"), r31 the stream: hashed into the
# log with SC5_TEST_HASH=1 (src/sc5/game.cpp), to compare two runs (pointers in it are block and offset, so the
# heap's layout does not show).
[[midasm_hook]]
name = "Sc5BattleSnapshotSaved"
address = 0x8215A800          # the save's end (addi r1,r1,192)
registers = ["r31"]

# Temporary: which writer puts the snapshot positions SC5_DBG_POS lists (synctest round trips differ there)
[[midasm_hook]]
name = "Sc5DbgSnapWrite"
address = 0x8211CB84          # the stream's write after its frame: r3 stream, r4 source, r5 size
registers = ["r1", "r3", "r4", "r5"]

# A fight's setup of a created character (sub_82148400): r11 its "wears downloadable models" flag, just loaded from the
# creation manager's entry (r4), with which the game swaps the character for a plain template of its style; cleared
# when every downloadable model it wears has its data on this PC (src/sc5/dlc.cpp), so costume pack parts show in fights.
[[midasm_hook]]
name = "Sc5DlcFighterModels"
address = 0x82147C94          # lis r25,0x8292, after lwz r11,0x34D8(r4) and before cmplwi cr6,r11,0
registers = ["r4", "r11"]
